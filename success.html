<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Your payment receipt | Lukaah</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f4f2e9;
        color: #171714;
        font:
          16px/1.6 Arial,
          Helvetica,
          sans-serif;
      }
      main {
        max-width: 720px;
        margin: 60px auto;
        padding: 32px;
      }
      header {
        display: flex;
        justify-content: space-between;
        border-bottom: 2px solid;
        padding-bottom: 20px;
      }
      a {
        color: inherit;
        text-underline-offset: 4px;
      }
      header a {
        font-size: 24px;
        font-weight: 900;
        text-decoration: none;
      }
      h1 {
        font-size: clamp(30px, 6vw, 48px);
        line-height: 1.1;
        letter-spacing: -0.04em;
        margin: 44px 0 20px;
      }
      #status {
        color: #58584f;
      }
      .receipt {
        background: #fff;
        padding: 28px;
        border: 1px solid;
        margin-top: 28px;
      }
      dl {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      dt {
        color: #58584f;
      }
      dd {
        margin: 0;
        text-align: right;
        overflow-wrap: anywhere;
      }
      .total {
        border-top: 1px solid;
        padding-top: 18px;
        font-weight: bold;
      }
      .button {
        display: inline-block;
        padding: 14px 20px;
        background: #171714;
        color: white;
        border: 0;
        font: inherit;
        font-weight: bold;
        text-decoration: none;
        cursor: pointer;
        margin: 12px 10px 0 0;
      }
      footer {
        margin-top: 32px;
        font-size: 14px;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #c34d38;
        outline-offset: 5px;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 480px) {
        main {
          margin: 0 auto;
          padding: 24px;
        }
        dl {
          grid-template-columns: 1fr;
          gap: 3px;
        }
        dd {
          text-align: left;
          margin-bottom: 12px;
        }
        .receipt {
          padding: 20px;
        }
      }
    </style>
    <script src="/receipt.js" defer></script>
  </head>
  <body>
    <main>
      <header><a href="/">LUKAAH</a><span>Payment & receipt</span></header>
      <h1 id="heading">Checking your payment.</h1>
      <p id="status" role="status" aria-live="polite">
        Please wait while we verify your payment with Stripe.
      </p>
      <section
        id="receipt"
        class="receipt"
        hidden
        aria-label="Verified payment receipt"
      >
        <h2 id="project"></h2>
        <p id="description"></p>
        <dl>
          <dt>Receipt number</dt>
          <dd id="number"></dd>
          <dt>Transaction date</dt>
          <dd id="date"></dd>
          <dt>Paid by</dt>
          <dd id="customer"></dd>
          <dt>Payment method</dt>
          <dd id="method"></dd>
          <dt class="total">Amount paid</dt>
          <dd class="total" id="total"></dd>
          <dt id="refund-label" hidden>Refunded</dt>
          <dd id="refunded" hidden></dd>
        </dl>
        <a id="download" class="button">Download receipt PDF</a>
        <p id="balance-note"></p>
      </section>
      <button id="retry" class="button" hidden>Check payment again</button>
      <noscript
        ><p>
          Enable JavaScript to verify your payment and download a receipt, or
          contact Lukaah below.
        </p></noscript
      >
      <footer>
        <a href="mailto:hello@lukaah.com">Need help with your receipt?</a> ·
        <a href="/ritual-fitness-agreement.html">View agreement</a>
      </footer>
    </main>
  </body>
</html>
