<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Line Brain</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Games for when you're stuck in line." />
<meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0e0d0c" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Line Brain" />
<link rel="manifest" href="/wyr/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/wyr/icon-180.png" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0d0c'/%3E%3Cpath d='M0 0h32v64H0z' fill='%23ff5a36' opacity='.95'/%3E%3Cpath d='M32 0h32v64H32z' fill='%233d7bff' opacity='.95'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%230e0d0c'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f1ec; --surface: #ffffff; --surface-2: #ebe6df; --ink: #141210; --muted: #6b655d; --line: #ddd6cc;
  --a: #e8451f; --b: #2563eb; --good: #15803d; --bad: #dc2626; --warn: #d97706; --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(20,18,16,.06), 0 8px 24px rgba(20,18,16,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0c; --surface: #1a1816; --surface-2: #24211e; --ink: #f4efe8; --muted: #9a928a; --line: #2d2a27;
    --a: #ff5a36; --b: #4d86ff; --good: #22c55e; --bad: #f43f5e; --warn: #f59e0b; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0d0c; --surface: #1a1816; --surface-2: #24211e; --ink: #f4efe8; --muted: #9a928a; --line: #2d2a27;
  --a: #ff5a36; --b: #4d86ff; --good: #22c55e; --bad: #f43f5e; --warn: #f59e0b; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif; font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--b); outline-offset: 2px; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.spacer { flex: 1; }
.hidden { display: none !important; }

.app {
  max-width: 560px; margin: 0 auto; min-height: 100vh; min-height: 100dvh;
  display: flex; flex-direction: column; gap: 12px;
  /* extra bottom room so Safari's floating toolbar never crowds the buttons */
  padding: max(12px, env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 40px);
}
@media (display-mode: standalone) { .app { padding-bottom: calc(env(safe-area-inset-bottom) + 14px); } }
#view { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); display: inline-block; }
.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -.02em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top-right { display: flex; gap: 8px; }
.icon-btn {
  width: 40px; height: 40px; flex: none; border-radius: 11px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0; font-size: 18px; font-weight: 700;
}
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:disabled { opacity: .35; }

/* hub */
.hub-intro { margin: 2px 0 0; font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -.025em; }
.hub-intro span { color: var(--muted); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile {
  border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 14px 14px 13px;
  text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 128px; position: relative; overflow: hidden;
  box-shadow: var(--shadow); transition: transform .12s ease;
}
.tile:active { transform: scale(.97); }
.tile::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 4px; background: var(--c); }
.tile .em { font-size: 30px; line-height: 1; margin: 4px 0 6px; }
.tile .nm { font-weight: 800; font-size: 17px; letter-spacing: -.015em; line-height: 1.1; }
.tile .tg { color: var(--muted); font-size: 13px; line-height: 1.3; }
.tile .pl { position: absolute; top: 14px; right: 12px; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); }
.hub-foot { text-align: center; color: var(--muted); font-size: 12px; margin: 6px 0 0; }

/* controls */
.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 12px 14px;
  font-weight: 700; font-size: 15px; line-height: 1.15; min-height: 46px; transition: transform .1s ease, opacity .2s;
}
.btn:active:not(:disabled) { transform: scale(.98); }
.btn:disabled { opacity: .4; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.big { padding: 16px; font-size: 17px; border-radius: 16px; font-weight: 800; min-height: 56px; }
.btn.good { background: var(--good); color: #fff; border-color: transparent; }
.btn.bad, .btn.danger { background: var(--bad); color: #fff; border-color: transparent; }
.btn.warn { background: var(--warn); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; }
.row { display: flex; gap: 8px; }
.row > .btn { flex: 1; }
.stack { display: flex; flex-direction: column; gap: 10px; }
#view > .stack { flex: 1; min-height: 0; }
.sticky-go { position: sticky; bottom: calc(env(safe-area-inset-bottom) + 12px); z-index: 3; box-shadow: 0 0 0 10px var(--bg), 0 -14px 18px 6px var(--bg); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 9px 6px; border-radius: 9px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 6px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; flex: none; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 12px;
  font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.input {
  font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%; min-width: 0;
}
.input:focus { outline: 2px solid var(--b); outline-offset: 0; border-color: transparent; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); font-weight: 600; font-size: 15px; }
.toggle input { width: 22px; height: 22px; accent-color: var(--ink); flex: none; }

/* cards */
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 20px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px;
}
.card .big { font-size: clamp(24px, 6.6vw, 33px); font-weight: 800; line-height: 1.12; letter-spacing: -.022em; margin: 0; overflow-wrap: anywhere; }
.card .lead { font-size: 16px; font-weight: 700; color: var(--muted); margin: 0; }
.card.fill { flex: 1; justify-content: center; min-height: 260px; }
.meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); }
.tag { display: inline-flex; align-items: center; gap: 6px; }
.tag .dot { width: 8px; height: 8px; border-radius: 50%; }
.bottom { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); animation: up .22s ease; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.06); opacity: 1; } 100% { transform: scale(1); } }
.pop { animation: pop .35s cubic-bezier(.2,.8,.2,1); }
.scores { display: flex; flex-direction: column; gap: 6px; }
.score-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font-weight: 700; }
.score-row .n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-row .s { font-family: "JetBrains Mono", monospace; font-size: 15px; }
.score-row.lead { border-color: var(--ink); }
.big-num { font-size: 64px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.center { text-align: center; align-items: center; }
.players-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 10px 10px 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.players-bar .who { min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.players-bar .btn { min-height: 36px; padding: 7px 12px; font-size: 14px; flex: none; }
.timerbar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; flex: none; }
.timerbar span { display: block; height: 100%; background: var(--ink); width: 100%; transform-origin: left; }

/* overlays */
.full {
  position: fixed; inset: 0; z-index: 40; background: var(--bg); color: var(--ink); display: flex; flex-direction: column;
  padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 24px) max(16px, env(safe-area-inset-left));
  touch-action: manipulation; overscroll-behavior: contain;
}
.full-x { position: absolute; top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); z-index: 5; }
.pass {
  position: fixed; inset: 0; background: var(--ink); color: var(--bg); z-index: 60; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px 24px calc(env(safe-area-inset-bottom) + 40px);
}
.pass-who { font-size: 44px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; overflow-wrap: anywhere; }
.pass-sub { opacity: .72; font-size: 16px; max-width: 30ch; }
.pass-go { margin-top: 12px; border: 0; background: var(--bg); color: var(--ink); border-radius: 16px; padding: 16px 30px; font-weight: 800; font-size: 17px; min-width: 200px; }
.sheet-wrap { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity .18s; }
.sheet-wrap.show { opacity: 1; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88dvh; overflow-y: auto; background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 10px 18px calc(env(safe-area-inset-bottom) + 28px); transform: translateY(24px); transition: transform .2s ease; display: flex; flex-direction: column; gap: 12px;
}
.sheet-wrap.show .sheet { transform: none; }
.sheet-grip { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 4px; flex: none; }
.sheet-title { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.02em; }
.sheet-body { font-size: 16px; line-height: 1.45; }
.sheet-body ol, .sheet-body ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.sheet-actions { display: flex; gap: 8px; }
.sheet-actions .btn { flex: 1; }
.pe { display: flex; flex-direction: column; gap: 8px; }
.pe-list { display: flex; flex-direction: column; gap: 6px; }
.pe-row { display: flex; align-items: center; gap: 8px; }
.pe-n { width: 18px; color: var(--muted); text-align: right; flex: none; }
.toast {
  position: fixed; left: 50%; bottom: calc(110px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 11px; font-size: 14px; font-weight: 700;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 90; max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; font-size: 120px; font-weight: 800; letter-spacing: -.05em; z-index: 4; background: inherit; }
.noscript { padding: 40px 20px; text-align: center; }

@media (min-width: 520px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><div class="noscript">Line Brain needs JavaScript turned on.</div></noscript>
