<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Line Brain</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="description" content="Would you rather, for waiting in lines. Hard choices only." />
<meta name="theme-color" content="#0e0d0c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Line Brain" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e0d0c'/%3E%3Cpath d='M0 0h32v64H0z' fill='%23ff5a36' opacity='.95'/%3E%3Cpath d='M32 0h32v64H32z' fill='%233d7bff' opacity='.95'/%3E%3Ccircle cx='32' cy='32' r='11' fill='%230e0d0c'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #f4f1ec;
  --surface: #ffffff;
  --ink: #141210;
  --muted: #6b655d;
  --line: #ddd6cc;
  --a: #e8451f;
  --a-soft: #fde4dc;
  --b: #2563eb;
  --b-soft: #dde7fd;
  --on-accent: #ffffff;
  --shadow: 0 1px 2px rgba(20,18,16,.06), 0 8px 24px rgba(20,18,16,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0d0c;
    --surface: #1a1816;
    --ink: #f4efe8;
    --muted: #9a928a;
    --line: #2d2a27;
    --a: #ff5a36;
    --a-soft: #3a1a12;
    --b: #4d86ff;
    --b-soft: #141f3a;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0d0c;
  --surface: #1a1816;
  --ink: #f4efe8;
  --muted: #9a928a;
  --line: #2d2a27;
  --a: #ff5a36;
  --a-soft: #3a1a12;
  --b: #4d86ff;
  --b-soft: #141f3a;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; letter-spacing: .04em; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  /* extra bottom room so Safari's floating toolbar never crowds the buttons */
  padding: max(12px, env(safe-area-inset-top)) 16px calc(env(safe-area-inset-bottom) + 40px);
  gap: 12px;
}

/* top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(90deg, var(--a) 50%, var(--b) 50%); display: inline-block; }
.top-right { display: flex; align-items: center; gap: 8px; }
.count { color: var(--muted); white-space: nowrap; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); display: grid; place-items: center; padding: 0;
}
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* chips */
.chips {
  display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
  margin: 0 -16px; padding: 2px 16px;
  scroll-snap-type: x proximity;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 6px; scroll-snap-align: start;
}
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* mode switch */
.modes { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
.modes button { border: 0; background: none; padding: 8px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.players { display: none; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 14px; }
.app.group .players { display: flex; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.stepper output { min-width: 28px; text-align: center; font-weight: 700; color: var(--ink); }

/* card */
.stage { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; touch-action: pan-y; }
.meta { display: flex; align-items: center; justify-content: space-between; color: var(--muted); }
.cat-tag { display: inline-flex; align-items: center; gap: 6px; }
.cat-tag .dot { width: 8px; height: 8px; border-radius: 50%; }
.prompt { font-size: 15px; font-weight: 600; color: var(--muted); margin: 0; }

.choices { flex: 1; display: flex; flex-direction: column; gap: 0; position: relative; min-height: 340px; }
.opt {
  flex: 1; border: 0; text-align: left; border-radius: 22px;
  padding: 22px 22px 36px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px;
  font-size: clamp(21px, 5.6vw, 27px); line-height: 1.18; font-weight: 700; letter-spacing: -.015em;
  transition: transform .18s ease, opacity .25s ease, filter .25s ease, background-color .25s ease;
  position: relative; overflow: hidden;
}
.opt .lbl { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 500; letter-spacing: .08em; opacity: .8; }
.opt.a { background: var(--a); color: var(--on-accent); }
.opt.b { background: var(--b); color: var(--on-accent); justify-content: flex-start; padding: 36px 22px 22px; }
.opt.b .lbl { order: 2; }
.opt:active { transform: scale(.985); }
.opt:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.or {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 52px; height: 52px; border-radius: 50%; background: var(--bg); color: var(--ink);
  display: grid; place-items: center; font-weight: 800; font-size: 15px; z-index: 2;
  border: 6px solid var(--bg); box-shadow: 0 0 0 1px var(--line);
}
.choices .gap { height: 8px; flex: none; }

.choices.decided { flex: none; min-height: 0; }
.choices.decided .opt { pointer-events: none; font-size: clamp(17px, 4.4vw, 21px); padding: 16px 18px 26px; gap: 6px; flex: none; }
.choices.decided .opt.b { padding: 26px 18px 16px; }
.choices.decided .or { width: 42px; height: 42px; font-size: 13px; border-width: 5px; }
.app.answered .modes, .app.answered .players { display: none; }
.panel p { font-size: 17px; }
@media (hover: none) { .opt .keys { display: none; } }
.choices.decided .opt:not(.picked) { opacity: .28; filter: saturate(.3); }
.opt .check { position: absolute; right: 18px; top: 18px; width: 30px; height: 30px; border-radius: 50%; background: rgba(255,255,255,.22); display: none; place-items: center; }
.opt.picked .check { display: grid; }
.opt .check svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.opt .bar { position: absolute; left: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.55); width: 0; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.opt.b .bar { top: 0; bottom: auto; }

/* twist + group reveal */
.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
  box-shadow: var(--shadow); display: none; animation: up .22s ease;
}
.panel.show { display: block; }
@keyframes up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
.panel h3 { margin: 0 0 2px; font-size: 12px; font-family: "JetBrains Mono", monospace; font-weight: 500; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.panel p { margin: 0 0 12px; font-size: 18px; font-weight: 700; line-height: 1.25; letter-spacing: -.01em; }
.row { display: flex; gap: 8px; }
.btn {
  flex: 1; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 11px 12px;
  font-weight: 700; font-size: 15px;
}
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.split { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin: 6px 0 8px; background: var(--line); }
.split span { display: block; height: 100%; transition: width .5s ease; }
.split-legend { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
.split-legend b { color: var(--ink); }

/* pass screen */
.pass {
  position: fixed; inset: 0; background: var(--ink); color: var(--bg); z-index: 20;
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px;
}
.pass.show { display: flex; }
.pass .who { font-size: 44px; font-weight: 800; letter-spacing: -.03em; }
.pass .sub { opacity: .7; font-size: 16px; max-width: 28ch; }
.pass button { margin-top: 10px; border: 0; background: var(--bg); color: var(--ink); border-radius: 14px; padding: 14px 28px; font-weight: 800; font-size: 17px; }

/* bottom bar */
.bottom { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.next { border: 0; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 14px; font-weight: 800; font-size: 16px; }
.hint { text-align: center; color: var(--muted); font-size: 12px; margin: 0; }
.toast {
  position: fixed; left: 50%; bottom: calc(112px + env(safe-area-inset-bottom)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 600;
  opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30;
}
.toast.show { opacity: 1; }

@media (display-mode: standalone) { .app { padding-bottom: calc(env(safe-area-inset-bottom) + 14px); } }
@media (min-height: 820px) { .choices { min-height: 440px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><i></i>Line Brain</div>
    <div class="top-right">
      <span class="count mono" id="count">0 answered</span>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle light or dark">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </header>

  <nav class="chips" id="chips" aria-label="Categories"></nav>

  <div class="modes" role="group" aria-label="Mode">
    <button id="soloBtn" aria-pressed="true">Solo</button>
    <button id="groupBtn" aria-pressed="false">Pass the phone</button>
  </div>
  <div class="players">
    <span>Players in line with you</span>
    <div class="stepper">
      <button id="minus" aria-label="Fewer players">−</button>
      <output id="pc">3</output>
      <button id="plus" aria-label="More players">+</button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="meta">
      <span class="cat-tag mono" id="catTag"><span class="dot"></span><span></span></span>
      <span class="mono" id="left"></span>
    </div>
    <p class="prompt">Would you rather…</p>
    <div class="choices" id="choices">
      <button class="opt a" id="optA"><span class="lbl">A<span class="keys"> · ← or 1</span></span><span class="txt"></span><span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><span class="bar"></span></button>
      <div class="gap"></div>
      <button class="opt b" id="optB"><span class="lbl">B<span class="keys"> · → or 2</span></span><span class="txt"></span><span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg></span><span class="bar"></span></button>
      <div class="or" aria-hidden="true">OR</div>
    </div>

    <section class="panel" id="twist" aria-live="polite">
      <h3>Okay, but now</h3>
      <p id="twistText"></p>
      <div class="row">
        <button class="btn" id="keepBtn">Still picking it</button>
        <button class="btn" id="switchBtn">I'd switch</button>
      </div>
    </section>

    <section class="panel" id="reveal" aria-live="polite">
      <h3>The line has spoken</h3>
      <div class="split"><span id="splitA" style="background:var(--a)"></span><span id="splitB" style="background:var(--b)"></span></div>
      <div class="split-legend"><span><b id="nA">0</b> picked A</span><span><b id="nB">0</b> picked B</span></div>
      <p id="revealText"></p>
    </section>
  </main>

  <footer>
    <div class="bottom">
      <button class="icon-btn" id="backBtn" aria-label="Previous question"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="next" id="nextBtn">Skip</button>
      <button class="icon-btn" id="shareBtn" aria-label="Share this question"><svg viewBox="0 0 24 24"><path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg></button>
    </div>
  </footer>
</div>

<div class="pass" id="pass">
  <div class="sub" id="passSub">Hand the phone over. No peeking.</div>
  <div class="who" id="passWho">Player 1</div>
  <button id="passGo">I'm ready</button>
</div>
<div class="toast" id="toast"></div>

<script>
const CATS = {
  pocket: { name: "Out of Pocket", color: "#ff3d6e" },
  brain:  { name: "Big Brain",     color: "#7c5cff" },
  moral:  { name: "Moral Damage",  color: "#f59e0b" },
  life:   { name: "Life Path",     color: "#10b981" },
  social: { name: "Social Risk",   color: "#06b6d4" },
  chaos:  { name: "Unhinged",      color: "#a3e635" },
};

// [category, option A, option B, twist if you picked A, twist if you picked B]
// Each twist is aimed at the option you picked, to make keeping it harder.
const Q = [
  // ---------- OUT OF POCKET ----------
  ["pocket","Have every text you've ever sent printed and mailed to your boss","Have every thought you have for 24 hours read aloud to your family",
    "The printout is also taped up in the break room. HR reads it before your boss does.",
    "The 24 hours land on a family funeral, and everyone is in the same room as you."],
  ["pocket","Have your camera roll projected at your own funeral","Have your search history engraved on your tombstone",
    "It's on shuffle, hidden and deleted folders included, and your grandparents are in the front row.",
    "It's your search history from age 13 to 19, and the cemetery gives walking tours."],
  ["pocket","Have your parents host a podcast about your dating life with 2 million listeners","Have your most recent ex get a weekly newspaper column about you",
    "Your parents bring each of your exes on as a guest. Season 1 is already recorded.",
    "Your current (or next) partner is the column's editor and approves every word."],
  ["pocket","Accidentally like your ex's photo from 2014 every single morning","Accidentally text \"love you\" to your boss once a week",
    "Your ex's new partner screenshots every like and posts a running tally.",
    "Your boss starts replying \"love you too.\" Last week it went to the whole company."],
  ["pocket","Have a laugh track play after everything you say","Have sad violin music play, audible to everyone, whenever you're upset",
    "It also plays when you deliver bad news. Breakups. Condolences. Layoffs.",
    "It kicks in when you're slightly annoyed too. Slow walkers. Self-checkout. This line."],
  ["pocket","Make your full browser history public with your name on it","Make your full bank statements public with your name on it",
    "Incognito included, sorted by time of day.",
    "Every Venmo note. Every 2 a.m. food order. Every subscription you forgot about."],
  ["pocket","Have your mom as your only follower, commenting on everything","Have your entire high school class see every post you make, forever",
    "She also reads every comment thread aloud at her book club.",
    "Your high school bully gets to pin one comment on every post."],
  ["pocket","Have your sleep-talking livestreamed nightly","Have your dreams uploaded to YouTube every morning",
    "Your partner (or future partner) is the top commenter.",
    "The algorithm pushes them to everyone you went to high school with."],
  ["pocket","Be stuck in an elevator for 3 hours with your ex and their new partner","Be stuck in an elevator for 3 hours with your boss while you have food poisoning",
    "They spend the whole 3 hours arguing about you.",
    "It's your first day, and your boss is the CEO."],
  ["pocket","Have your friends publicly rank all your exes","Have all your exes publicly rank you",
    "Your current partner is on the list, and they come in last.",
    "They compare notes in a group chat first, and you're in it."],
  ["pocket","Wear your exact 7th grade outfit to your next job interview","Have your 7th grade self conduct your next job interview",
    "It's your dream job, and they record every interview.",
    "Your 7th grade self also decides whether you keep your current job."],
  ["pocket","Lick the escalator handrail at the mall","Drink one full glass of water from a public pool in August",
    "It's an airport escalator in flu season, and you lick the whole way down.",
    "It comes from the kiddie pool at a water park on the 4th of July."],
  ["pocket","Have your entire group chat history read out at your wedding","Have your best friend give your wedding speech after 9 drinks with no notes",
    "Your new in-laws read it aloud, and that includes the thread about them.",
    "They also keep the microphone for the whole reception."],
  ["pocket","Have your phone randomly call your crush once a day for 10 seconds","Have your phone randomly post your last photo to your story once a week",
    "Sometimes the call goes out at 3 a.m., and they hear whatever you're doing.",
    "Screenshots count as photos."],
  ["pocket","Every time you lie, you sneeze loudly","Every time someone compliments you, you burp",
    "Polite lies count. \"I love it.\" \"I'm fine.\" \"Happy for you.\"",
    "That includes compliments on first dates, in job interviews, and in your wedding vows."],
  ["pocket","Be caught singing alone in your car by your crush every week","Have your crush hear you talking to yourself, once, at your worst",
    "They film it every time, and it's turning into a series.",
    "You were talking about them, by name, for a long time."],
  ["pocket","Have your therapist's notes about you leak to your friends","Have your friends' honest notes about you leak to your therapist",
    "The notes include everything you've said about those exact friends.",
    "Your therapist reads them, then quietly agrees in every session."],
  ["pocket","Find out exactly what your partner's ex says about you","Find out exactly what your own ex says about you",
    "Your partner agrees with about half of it.",
    "It's the exact version they told everyone you both know."],
  ["pocket","Have everyone see your screen time report, broken down by app","Have everyone see your Spotify listening history from your worst breakup",
    "It shows how many hours you spent on one specific person's profile.",
    "Timestamps included, like the song you played 47 times between 2 and 4 a.m."],
  ["pocket","Show up to a funeral dressed for a costume party","Show up to a costume party dressed for a funeral and stay in character all night",
    "You're dressed as a clown, and you're giving the eulogy.",
    "Your character is the grieving widow, and the host doesn't know it's a bit."],
  ["pocket","Have your future kid read every message you sent at 16","Have your 16-year-old self read every message you send today",
    "They read them at 16 and quote them back at you during every fight.",
    "Your 16-year-old self also gets to text your current boss once."],
  ["pocket","Smell your own breath, constantly, forever","Smell everyone else's breath, constantly, forever",
    "Everyone around you smells it at the same strength you do.",
    "That includes every date, every kiss, and every dentist."],
  ["pocket","Get roasted on stage by a pro comedian who knows all your secrets","Roast your own family on stage while they sit in the front row",
    "It's televised, and your family and your boss are in the audience.",
    "Afterward your family roasts you back, with a professional writer."],
  ["pocket","Have your current location shared live with every ex","Have every ex's current location shared live with you, forever",
    "Your current partner gets a ping every time an ex checks it.",
    "One night, one of them is parked outside your place."],
  ["pocket","Say yes to the next 10 things anyone asks you","Say no to the next 10 things the people you love ask you",
    "The first ask is from the stranger reading this over your shoulder.",
    "One of the 10 is your best friend asking you to be in their wedding."],
  ["pocket","Have a stranger read your journal out loud on a train","Have your dad read your journal silently, and never mention it",
    "It's your daily commute, and the stranger rides it every day.",
    "You catch him re-reading one page, and it's the worst one."],

  // ---------- BIG BRAIN ----------
  ["brain","Use a teleporter that destroys you and builds a perfect copy at your destination, every day","Have a 2-hour commute each way, forever",
    "Sometimes it glitches and doesn't destroy the original. Now there are two of you, and one has to go.",
    "It's a packed bus with no signal. That's 1,000 hours a year, every year."],
  ["brain","Take only the mystery box (a perfect predictor put $1M in it only if it predicted you'd take it alone)","Take both boxes: the mystery box plus a guaranteed $1,000",
    "The predictor decided yesterday, and nothing you do now changes what's in the box. You're leaving $1,000 on the table.",
    "Everyone who's taken both boxes so far, all 1,000 of them, walked away with exactly $1,000."],
  ["brain","Know for certain we're in a simulation","Never know, but probably not in one",
    "You also find out it's someone's school project, and it's due Friday.",
    "Everyone else gets told for sure. You're the only one who doesn't know."],
  ["brain","Be the smartest person in a mediocre world","Be the least smart person in a world of geniuses",
    "Nobody can follow what you say, including the people you love.",
    "They're kind about it, which is worse. They slow down when they talk to you."],
  ["brain","Have perfect memory of everything you've ever experienced","Be able to permanently forget anything you choose",
    "That's every argument word for word, and every face someone made when you let them down.",
    "You don't remember what you erased or why. You might have done it already."],
  ["brain","Go back to 1500 with a modern phone (offline, solar charger)","Go forward to 2500 with nothing but the clothes you're wearing",
    "You land in Europe during a plague, speaking modern English. A glowing rectangle looks a lot like witchcraft.",
    "In 2500, people from the past get kept in a museum, a nice one, for life."],
  ["brain","Upload your mind to a computer right before you die","Die naturally, and that's that",
    "The company that owns the servers was just bought by an ad company.",
    "Your whole family uploads. You're the only one who doesn't."],

  unanimous: ["Unanimous. You're all the same kind of weird.", "Total agreement. Suspicious.", "Nobody broke ranks. Next one should split you."],
  split: ["Dead even. Someone has to defend their pick before the line moves.", "Perfect split. Argue it out.", "50/50. This is how friendships end."],
  lone: ["One person stood alone. They owe the group an explanation.", "There's a lone wolf. Make them defend it.", "Odd one out. Interrogate them."],

// ----- storage helpers (never required) -----
const store = {
  get(k, d) { try { const v = localStorage.getItem("lb:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("lb:" + k, JSON.stringify(v)); } catch {} },
};

// ----- state -----
const state = {
  cat: store.get("cat", "all"),
  mode: store.get("mode", "solo"),
  players: store.get("players", 3),
  answered: store.get("answered", 0),
  seen: new Set(store.get("seen", [])),
  history: [],
  hIndex: -1,
  current: null,
  picked: null,
  votes: [],
  voter: 0,
};

const $ = (id) => document.getElementById(id);
const els = {
  app: $("app"), chips: $("chips"), count: $("count"), catTag: $("catTag"), left: $("left"),
  choices: $("choices"), optA: $("optA"), optB: $("optB"),
  twist: $("twist"), twistText: $("twistText"), keepBtn: $("keepBtn"), switchBtn: $("switchBtn"),
  reveal: $("reveal"), splitA: $("splitA"), splitB: $("splitB"), nA: $("nA"), nB: $("nB"), revealText: $("revealText"),
  next: $("nextBtn"), back: $("backBtn"), share: $("shareBtn"),
  pass: $("pass"), passWho: $("passWho"), passSub: $("passSub"), passGo: $("passGo"),
  soloBtn: $("soloBtn"), groupBtn: $("groupBtn"), pc: $("pc"), toast: $("toast"),
};

const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const pool = () => Q.map((q, i) => i).filter((i) => state.cat === "all" || Q[i][0] === state.cat);

// ----- chips -----
function renderChips() {
  const all = [["all", "Everything", "var(--ink)"], ...Object.entries(CATS).map(([k, v]) => [k, v.name, v.color])];
  els.chips.innerHTML = "";
  for (const [k, name, color] of all) {
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", String(state.cat === k));
    b.innerHTML = `<span class="dot" style="background:${color}"></span>${name}`;
    b.onclick = () => { state.cat = k; store.set("cat", k); renderChips(); newQuestion(); };
    els.chips.appendChild(b);
  }
}

// ----- question flow -----
function drawIndex() {
  const p = pool();
  let fresh = p.filter((i) => !state.seen.has(i));
  if (!fresh.length) { p.forEach((i) => state.seen.delete(i)); fresh = p; toast("Deck reshuffled"); }
  // avoid immediate repeat
  if (fresh.length > 1 && state.current != null) fresh = fresh.filter((i) => i !== state.current);
  return pick(fresh);
}

function newQuestion() {
  const idx = drawIndex();
  state.history = state.history.slice(0, state.hIndex + 1);
  state.history.push(idx);
  state.hIndex = state.history.length - 1;
  show(idx);
}

function show(idx) {
  state.current = idx;
  state.picked = null;
  state.votes = [];
  state.voter = 0;
  const [cat, a, b] = Q[idx];
  const c = CATS[cat];
  els.catTag.querySelector(".dot").style.background = c.color;
  els.catTag.lastElementChild.textContent = c.name.toUpperCase();
  els.optA.querySelector(".txt").textContent = a;
  els.optB.querySelector(".txt").textContent = b;
  els.choices.classList.remove("decided");
  els.optA.classList.remove("picked"); els.optB.classList.remove("picked");
  els.optA.querySelector(".bar").style.width = "0";
  els.optB.querySelector(".bar").style.width = "0";
  els.twist.classList.remove("show");
  els.reveal.classList.remove("show");
  els.app.classList.remove("answered");
  els.keepBtn.removeAttribute("aria-pressed"); els.switchBtn.removeAttribute("aria-pressed");
  els.next.textContent = "Skip";
  els.back.disabled = state.hIndex <= 0;
  els.back.style.opacity = state.hIndex <= 0 ? .4 : 1;
  const p = pool(); const unseen = p.filter((i) => !state.seen.has(i) && i !== idx).length;
  els.left.textContent = `${unseen} left in deck`;
  if (state.mode === "group") openPass();
}

function choose(which) {
  if (state.current == null || state.picked != null) return;
  if (state.mode === "group") return groupVote(which);
  state.picked = which;
  markPicked(which);
  commitAnswered();
  els.twistText.textContent = Q[state.current][which === "a" ? 3 : 4];
  els.twist.classList.add("show");
  els.next.textContent = "Next one →";
}

function markPicked(which) {
  els.choices.classList.add("decided");
  els.app.classList.add("answered");
  (which === "a" ? els.optA : els.optB).classList.add("picked");
  if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
}

function commitAnswered() {
  state.seen.add(state.current);
  state.answered += 1;
  store.set("seen", [...state.seen]);
  store.set("answered", state.answered);
  renderCount();
}

function renderCount() { els.count.textContent = `${state.answered} answered`; }

// ----- group mode -----
function openPass() {
  els.passWho.textContent = `Player ${state.voter + 1}`;
  els.passSub.textContent = state.voter === 0 ? "New question. Read it to yourself, pick, then pass it on." : "Hand the phone over. No peeking at the last pick.";
  els.pass.classList.add("show");
}
els.passGo.onclick = () => els.pass.classList.remove("show");

function groupVote(which) {
  state.votes.push(which);
  state.voter += 1;
  if (navigator.vibrate) try { navigator.vibrate(12); } catch {}
  if (state.voter < state.players) { openPass(); return; }
  // reveal
  state.picked = "group";
  commitAnswered();
  const nA = state.votes.filter((v) => v === "a").length, nB = state.votes.length - nA;
  els.choices.classList.add("decided"); els.app.classList.add("answered");
  if (nA >= nB) els.optA.classList.add("picked");
  if (nB >= nA) els.optB.classList.add("picked");
  const pa = Math.round((nA / state.votes.length) * 100);
  els.optA.querySelector(".bar").style.width = pa + "%";
  els.optB.querySelector(".bar").style.width = (100 - pa) + "%";
  els.splitA.style.width = pa + "%"; els.splitB.style.width = (100 - pa) + "%";
  els.nA.textContent = nA; els.nB.textContent = nB;
  const kind = nA === 0 || nB === 0 ? "unanimous" : nA === nB ? "split" : Math.min(nA, nB) === 1 ? "lone" : "majority";
  els.revealText.textContent = pick(GROUP_LINES[kind]);
  els.reveal.classList.add("show");
  els.next.textContent = "Next one →";
}

// ----- twist -----
function twistAnswer(sw) {
  els.keepBtn.setAttribute("aria-pressed", String(!sw));
  els.switchBtn.setAttribute("aria-pressed", String(sw));
  if (sw) {
    const other = state.picked === "a" ? "b" : "a";
    els.optA.classList.remove("picked"); els.optB.classList.remove("picked");
    (other === "a" ? els.optA : els.optB).classList.add("picked");
    state.picked = other;
    toast("Flipped. Interesting.");
  } else {
    toast("Holding the line.");
  }
}
els.keepBtn.onclick = () => twistAnswer(false);
els.switchBtn.onclick = () => twistAnswer(true);

// ----- nav -----
els.optA.onclick = () => choose("a");
els.optB.onclick = () => choose("b");
els.next.onclick = () => {
  if (state.picked == null && state.current != null) { state.seen.add(state.current); store.set("seen", [...state.seen]); }
  if (state.hIndex < state.history.length - 1) { state.hIndex += 1; show(state.history[state.hIndex]); }
  else newQuestion();
};
els.back.onclick = () => { if (state.hIndex > 0) { state.hIndex -= 1; show(state.history[state.hIndex]); } };

els.share.onclick = async () => {
  const [, a, b] = Q[state.current];
  const text = `Would you rather…\nA) ${a}\nB) ${b}`;
  const url = location.origin + location.pathname;
  try {
    if (navigator.share) { await navigator.share({ title: "Would you rather", text, url }); return; }
    await navigator.clipboard.writeText(`${text}\n\n${url}`); toast("Copied");
  } catch {}
};

// mode
function setMode(m) {
  state.mode = m; store.set("mode", m);
  els.app.classList.toggle("group", m === "group");
  els.soloBtn.setAttribute("aria-pressed", String(m === "solo"));
  els.groupBtn.setAttribute("aria-pressed", String(m === "group"));
  if (state.current != null) show(state.current);
}
els.soloBtn.onclick = () => setMode("solo");
els.groupBtn.onclick = () => setMode("group");
function setPlayers(n) {
  state.players = Math.max(2, Math.min(8, n)); store.set("players", state.players);
  els.pc.textContent = state.players;
}
$("minus").onclick = () => setPlayers(state.players - 1);
$("plus").onclick = () => setPlayers(state.players + 1);

// theme
function applyTheme(t) {
  if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
}
applyTheme(store.get("theme", null));
$("themeBtn").onclick = () => {
  const dark = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() === "#0e0d0c";
  const t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t);
};

// keyboard
document.addEventListener("keydown", (e) => {
  if (els.pass.classList.contains("show")) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); els.passGo.click(); } return; }
  if (e.key === "ArrowLeft" || e.key === "1" || e.key.toLowerCase() === "a") choose("a");
  else if (e.key === "ArrowRight" || e.key === "2" || e.key.toLowerCase() === "b") choose("b");
  else if (e.key === " " || e.key === "Enter") { if (document.activeElement && document.activeElement.classList.contains("opt")) return; e.preventDefault(); els.next.click(); }
  else if (e.key === "Backspace") els.back.click();
});

// swipe up/left = next (after answering)
let sx = 0, sy = 0;
$("stage").addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
$("stage").addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4) {
    if (dx < 0) els.next.click(); else els.back.click();
  }
}, { passive: true });

let tt;
function toast(msg) {
  els.toast.textContent = msg; els.toast.classList.add("show");
  clearTimeout(tt); tt = setTimeout(() => els.toast.classList.remove("show"), 1400);
}

// boot
if (!["all", ...Object.keys(CATS)].includes(state.cat)) state.cat = "all";
renderChips(); renderCount(); setPlayers(state.players);
els.app.classList.toggle("group", state.mode === "group");
els.soloBtn.setAttribute("aria-pressed", String(state.mode === "solo"));
els.groupBtn.setAttribute("aria-pressed", String(state.mode === "group"));
newQuestion();
</script>
</body>
</html>
